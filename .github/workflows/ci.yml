# Checks the editor engine against Docmost's document format and the project files, builds the app and runs the
# DocmostKit and app unit tests for every pull request to main and every push to main.
# The UI tests need the local dev Docmost instance, so they stay local (Tools/run-uitests.sh).
# Actions are pinned to a commit (Dependabot proposes updates, .github/dependabot.yml).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request cancels the check still running for it. Runs on main finish, so every merged
# commit keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Build and unit tests
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27.1
        run: |
          # The image defaults to Xcode 27.0; development uses 27.1.
          xcode=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | head -1)
          if [ -n "$xcode" ]; then sudo xcode-select --switch "$xcode"; fi
          xcodebuild -version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Engine checks
        # The engine's own extensions must match Docmost's document format (Engine/FORMAT.md), the sources and the check
        # tools must type-check (esbuild only strips types), and the committed engine.js must be the build of Engine/src.
        # Corepack takes pnpm's version from Engine/package.json.
        working-directory: Engine
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run check
          corepack pnpm run typecheck
          node build.mjs
          git diff --exit-code -- ../Diderot/Resources/Engine/engine.js

      - name: Project checks
        # Tools/check-project.sh: translations, project.yml against the Xcode project, shellcheck. The tools in the versions
        # it was last run with on the Mac (xcodegen --version, shellcheck --version), checked against their release files.
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256_AARCH64: 56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79
          SHELLCHECK_SHA256_X86_64: 3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $tools/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$tools/xcodegen.zip" -d "$tools"
          if [ "$(uname -m)" = arm64 ]; then arch=aarch64 sum=$SHELLCHECK_SHA256_AARCH64; else arch=x86_64 sum=$SHELLCHECK_SHA256_X86_64; fi
          curl -fsSL -o "$tools/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.darwin.$arch.tar.xz"
          echo "$sum  $tools/shellcheck.tar.xz" | shasum -a 256 -c
          tar -xJf "$tools/shellcheck.tar.xz" -C "$tools"
          PATH="$tools/xcodegen/bin:$tools/shellcheck-$SHELLCHECK_VERSION:$PATH" Tools/check-project.sh

      - name: DocmostKit tests
        # The live tests need a Docmost server.
        run: swift test --package-path Packages/DocmostKit --skip Live

      - name: App unit tests
        # No certificate on the runner: ad-hoc signing ("Sign to Run Locally") is enough for the simulator.
        run: >
          xcodebuild test
          -project Diderot.xcodeproj
          -scheme Diderot
          -destination "platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0"
          -only-testing:DiderotTests
          -parallel-testing-enabled NO
          -resultBundlePath TestResults.xcresult
          CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
